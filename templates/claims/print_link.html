{% load static %}
<div class="print-actions">
{% if perms.claims.view_claim %}{% if claim.pk %}<a class="button print-saved-document" href="{% url 'print_document' claim.pk %}?print=1"><svg class="ui-icon" aria-hidden="true"><use href="{% static 'lucide-icons.svg' %}#Printer"></use></svg> พิมพ์เอกสาร</a><a class="button" href="{% url 'claim_export' claim.pk %}"><svg class="ui-icon" aria-hidden="true"><use href="{% static 'lucide-icons.svg' %}#Download"></use></svg> ดาวน์โหลดเอกสาร (CSV)</a>{% else %}<a class="button print-saved-document" href="{% url 'print_center' %}"><svg class="ui-icon" aria-hidden="true"><use href="{% static 'lucide-icons.svg' %}#Printer"></use></svg> พิมพ์เอกสาร</a><span class="muted">บันทึกเอกสารก่อนดาวน์โหลด</span>{% endif %}{% endif %}

<span id="clear-form-status" class="muted" role="status"></span>
</div>
